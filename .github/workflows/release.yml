name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require signing continuity before public distribution
        run: |
          echo '::error::APK publication is disabled until the original signing identity and a non-debuggable release configuration are available. CI debug artifacts are for testing only.'
          exit 1
